    silent: true
    vars:
      REPO: '{{.REPO | default ""}}'
    cmds:
      - |
        #!/usr/bin/env fish

        set_color '#88C0D0'
        echo ""
        echo "  Branch Protection Manager"
        echo "  ══════════════════════════════════════════════════"
        set_color normal

        if test -n "{{.REPO}}"
          set_color '#EBCB8B'
          echo "  Repo: {{.REPO}}"
          set_color normal
          bash "{{.ROOT_DIR}}/scripts/manage-branch-protection.sh" "{{.REPO}}"
        else
          set_color '#EBCB8B'
          echo "  Repo: auto-detect from git remote"
          set_color normal
          bash "{{.ROOT_DIR}}/scripts/manage-branch-protection.sh"
        end

